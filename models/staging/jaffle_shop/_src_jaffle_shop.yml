version: 2

sources:
  - name: jaffle_shop
    description: a clone of the Snowflake database
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: raw customer data
        columns:
          - name: id
            description: primary key
            data_tests:
              - unique
              - not_null
              
      - name: orders
        description: raw orders data
        columns:
          - name: id
            description: primary key
            data_tests:
              - unique
              - not_null
        config:
          freshness:
            warn_after:
              count: 5
              period: day
            error_after:
              count: 14
              period: day
          loaded_at_field: _etl_loaded_at