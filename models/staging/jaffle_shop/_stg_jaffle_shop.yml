models:
  - name: stg_jaffle_shop__customers
    description: one unique customer per row
    columns:
      - name: customer_id
        description: primary key for customers table
        data_tests:
          - not_null
          - unique

  - name: stg_jaffle_shop__orders
    columns:
      - name: order_id
        description: primary key for orders table
        data_tests:
          - not_null
          - unique

      - name: order_status
        description: "{{ docs('order_status') }}"
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  - returned
                  - placed
                  - return_pending
      
      - name: customer_id
        description: foreign key
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
