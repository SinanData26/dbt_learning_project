models:
  - name: stg_jaffle_shop__customers
    columns:
      - name: customer_id
        description: primary key column for customers table
        data_tests:
          - not_null
          - unique

  - name: stg_jaffle_shop__orders
    columns:
      - name: order_id
        description: primary key column for orders table
        data_tests:
          - not_null
          - unique

      - name: argumentsstatus
        description: order status column
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  - returned
                  - placed
                  - return_pending